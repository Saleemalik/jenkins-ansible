
---
- name: Install Node.js repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'


- name: Configure Node.js 22 repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types:
      - deb
    uris:
      - https://deb.nodesource.com/node_22.x
    suites:
      - nodistro
    components:
      - main
    signed_by: /etc/apt/keyrings/nodesource.asc
    state: present
    enabled: true

- name: Install Node.js and npm
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: nodejs_version
  changed_when: false

- name: Verify npm installation
  ansible.builtin.command: npm --version
  register: npm_version
  changed_when: false

- name: Display installed versions
  ansible.builtin.debug:
    msg:
      - "Node.js: {{ nodejs_version.stdout }}"
      - "npm: {{ npm_version.stdout }}"
