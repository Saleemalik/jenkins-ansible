---
# tasks file for roles/postgresql

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install PostgreSQL packages and ACL utilities
  ansible.builtin.apt:
    name: "{{ postgresql_packages }}"
    state: present

- name: Ensure PostgreSQL service is started and enabled
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Ensure PostgreSQL Ansible temporary directory exists
  ansible.builtin.file:
    path: /var/lib/postgresql/.ansible/tmp
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Create PostgreSQL CI database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ ci_database_user }}"
    password: "{{ ci_database_password }}"
    state: present

- name: Create PostgreSQL CI database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ ci_database_name }}"
    owner: "{{ ci_database_user }}"
    state: present